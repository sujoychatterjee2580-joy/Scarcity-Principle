<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kids & Family Word Mystery 🌟</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --gold: #fbbf24;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-x: hidden;
    }

    .game-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Top HUD */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid var(--border);
      color: var(--gold);
    }

    /* Clue Display */
    .clue-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .clue-emoji {
      font-size: 55px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }

    .clue-hint-text {
      font-size: 16px;
      font-weight: 700;
      color: #cbd5e1;
    }

    /* Word Tile Slots */
    .word-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tile-slot {
      width: 58px;
      height: 62px;
      border: 3px solid var(--border);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      transition: all 0.2s;
    }

    .tile-slot.filled {
      border-color: var(--accent);
      background: #0369a1;
      transform: scale(1.05);
    }

    .tile-slot.hint-given {
      border-color: var(--success);
      background: #15803d;
      color: #fff;
    }

    /* Selection Keyboard / Letters */
    .letter-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
    }

    .btn-letter {
      width: 48px;
      height: 52px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-letter:active {
      transform: scale(0.92);
      background: var(--accent);
    }

    .btn-letter.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      margin-top: 8px;
    }

    .btn-sub {
      background: #475569;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Win Pop Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .modal-overlay h1 {
      font-size: 32px;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .modal-overlay p {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .btn-cta {
      background: linear-gradient(135deg, var(--success), #16a34a);
      color: #fff;
      border: none;
      padding: 14px 34px;
      font-size: 17px;
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(34, 197, 94, 0.4);
    }

    .btn-cta:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Win Screen Modal -->
    <div id="win-modal" class="modal-overlay" style="display: none;">
      <h1>অসাধারণ! 🎉</h1>
      <p id="win-desc">তুমি সঠিক শব্দটি বানিয়ে ফেলেছো!</p>
      <button class="btn-cta" onclick="nextPuzzle()">পরের শব্দ খেলুন ⏩</button>
    </div>

    <!-- HUD -->
    <div class="top-bar">
      <div class="badge">🌟 লেভেল: <span id="level-txt">1</span></div>
      <div class="badge">⭐ স্কোর: <span id="score-txt">0</span></div>
    </div>

    <!-- Clue & Emoji Box -->
    <div class="clue-box">
      <div class="clue-emoji" id="clue-emoji">☀️</div>
      <div class="clue-hint-text" id="clue-hint">দিনের আকাশে আলো ও তাপ দেয়</div>
    </div>

    <!-- Word Tile Slots -->
    <div class="word-slots" id="slots-area"></div>

    <!-- Letter Selection Keyboard -->
    <div class="letter-options" id="letters-area"></div>

    <div class="bottom-actions">
      <button class="btn-sub" onclick="resetCurrentWord()">↩️ মুছে আবার লেখো</button>
    </div>
  </div>

  <script>
    // --- Web Audio API Synth ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type, duration, vol = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundTap() { playTone(480, 'sine', 0.08, 0.12); }
    function soundWin() {
      playTone(523.25, 'triangle', 0.12, 0.2);
      setTimeout(() => playTone(659.25, 'triangle', 0.12, 0.2), 80);
      setTimeout(() => playTone(783.99, 'triangle', 0.25, 0.25), 160);
    }
    function soundFail() {
      playTone(220, 'sawtooth', 0.15, 0.2);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.2), 100);
    }

    // --- ছোট ও সহজ শব্দের তালিকা (ক্লু ও ইমোজি সহ) ---
    const PUZZLES = [
      {
        word: "SUN",
        emoji: "☀️",
        hint: "দিনের আকাশে আলো ও তাপ দেয়",
        firstLetter: "S"
      },
      {
        word: "CAT",
        emoji: "🐱",
        hint: "মিউ মিউ করে ডাকে ও দুধ খায়",
        firstLetter: "C"
      },
      {
        word: "CAR",
        emoji: "🚗",
        hint: "চার চাকার ছোট গাড়ি",
        firstLetter: "C"
      },
      {
        word: "TREE",
        emoji: "🌳",
        hint: "সবুজ পাতা থাকে এবং অক্সিজেন দেয়",
        firstLetter: "T"
      },
      {
        word: "FISH",
        emoji: "🐟",
        hint: "জলে সাঁতার কাটে ও ডাঙ্গায় বাঁচেনা",
        firstLetter: "F"
      },
      {
        word: "BIRD",
        emoji: "🐦",
        hint: "ডানা মেলে আকাশে উড়ে বেড়ায়",
        firstLetter: "B"
      },
      {
        word: "BALL",
        emoji: "⚽",
        hint: "গোল আকারের জিনিস যা দিয়ে খেলি",
        firstLetter: "B"
      },
      {
        word: "MOON",
        emoji: "🌙",
        hint: "রাতের আকাশে আলো দেয়",
        firstLetter: "M"
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let currentInput = [];
    let currentPuzzle = null;

    const levelTxt = document.getElementById("level-txt");
    const scoreTxt = document.getElementById("score-txt");
    const clueEmoji = document.getElementById("clue-emoji");
    const clueHint = document.getElementById("clue-hint");
    const slotsArea = document.getElementById("slots-area");
    const lettersArea = document.getElementById("letters-area");
    const winModal = document.getElementById("win-modal");
    const winDesc = document.getElementById("win-desc");

    function loadPuzzle() {
      currentPuzzle = PUZZLES[currentIdx];
      levelTxt.innerText = currentIdx + 1;
      clueEmoji.innerText = currentPuzzle.emoji;
      clueHint.innerText = currentPuzzle.hint;

      // প্রথম অক্ষরটি আগেই সাহায্য হিসেবে দিয়ে দেওয়া হলো
      currentInput = [currentPuzzle.firstLetter];

      renderSlots();
      renderKeyboard();
    }

    function renderSlots() {
      slotsArea.innerHTML = "";
      for (let i = 0; i < currentPuzzle.word.length; i++) {
        const slot = document.createElement("div");
        slot.className = "tile-slot";

        if (i === 0) {
          slot.classList.add("hint-given");
          slot.innerText = currentPuzzle.firstLetter;
        } else if (currentInput[i]) {
          slot.classList.add("filled");
          slot.innerText = currentInput[i];
        } else {
          slot.innerText = "";
        }
        slotsArea.appendChild(slot);
      }
    }

    function renderKeyboard() {
      lettersArea.innerHTML = "";

      // সঠিক শব্দের বাকি অক্ষরগুলোর সাথে কিছু বাড়তি এলোমেলো অক্ষর মিশিয়ে দেওয়া
      const correctChars = currentPuzzle.word.slice(1).split("");
      const randomAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      let mixedOptions = [...correctChars];

      while (mixedOptions.length < 8) {
        const r = randomAlphabet[Math.floor(Math.random() * randomAlphabet.length)];
        if (!mixedOptions.includes(r)) mixedOptions.push(r);
      }

      // ওলটপালট করা (Shuffle)
      mixedOptions.sort(() => 0.5 - Math.random());

      mixedOptions.forEach(char => {
        const btn = document.createElement("button");
        btn.className = "btn-letter";
        btn.innerText = char;
        btn.onclick = () => selectLetter(char, btn);
        lettersArea.appendChild(btn);
      });
    }

    function selectLetter(char, btn) {
      initAudio();
      if (currentInput.length < currentPuzzle.word.length) {
        currentInput.push(char);
        btn.classList.add("disabled");
        soundTap();
        renderSlots();

        // পুরো শব্দ পূরণ হয়েছে কি না পরীক্ষা
        if (currentInput.length === currentPuzzle.word.length) {
          checkWord();
        }
      }
    }

    function resetCurrentWord() {
      initAudio();
      soundTap();
      currentInput = [currentPuzzle.firstLetter];
      renderSlots();
      // বাটনগুলো সক্রিয় করা
      const btns = lettersArea.querySelectorAll(".btn-letter");
      btns.forEach(b => b.classList.remove("disabled"));
    }

    function checkWord() {
      const typed = currentInput.join("");
      if (typed === currentPuzzle.word) {
        soundWin();
        score += 10;
        scoreTxt.innerText = score;
        winDesc.innerText = `অভিনন্দন! সঠিক শব্দটি হলো: ${currentPuzzle.word} ${currentPuzzle.emoji}`;
        setTimeout(() => {
          winModal.style.display = "flex";
        }, 300);
      } else {
        soundFail();
        // লাল হয়ে কাঁপবে
        const slots = slotsArea.querySelectorAll(".tile-slot");
        slots.forEach((s, idx) => {
          if (idx > 0) s.style.backgroundColor = "#ef4444";
        });

        setTimeout(() => {
          resetCurrentWord();
        }, 700);
      }
    }

    function nextPuzzle() {
      winModal.style.display = "none";
      currentIdx = (currentIdx + 1) % PUZZLES.length;
      loadPuzzle();
    }

    // Launch Game
    loadPuzzle();
  </script>
</body>
</html>
